<svg xmlns="http://www.w3.org/2000/svg" width="960" height="630" viewBox="0 0 960 630" role="img" aria-labelledby="title desc"><title id="title">Make a little snow man — step 1: Find snow that sticks together</title><desc id="desc">Dress warmly and choose a flat snowy patch with a grown-up. Squeeze a handful of clean snow in your mittens. If it holds together, you are ready. If it stays powdery, save this build for stickier snow rather than adding water that may freeze.</desc><defs>
