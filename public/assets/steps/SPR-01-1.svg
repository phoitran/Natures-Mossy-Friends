<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc"><title id="title">A tiny woodland village: Map your little world</title><desc id="desc">Place the cardboard box toward the back of the tray. Leave a hand-width of space in front for a path. Point to the door, garden and path before building.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#bd7254" stroke-width="2"/></marker></defs><rect width="640" height="420" rx="24" fill="#f8f6ee"/><rect x="80" y="100" width="480" height="210" rx="22" fill="#f2eadc" stroke="#b09b79" stroke-width="3"/><rect x="90" y="110" width="460" height="190" rx="16" fill="#faf5e9" stroke="#d1c2a7" stroke-width="2"/><rect x="160" y="130" width="100" height="80" rx="6" fill="#d7bca0" stroke="#8c684e" stroke-width="3"/><path d="M310 270 Q350 230 430 190" fill="none" stroke="#c2a66f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="210" y="244" font-family="Arial,sans-serif" font-size="20" font-weight="500" text-anchor="middle" fill="#293e32">box base</text><path d="M380 150 L285 163" fill="none" stroke="#bd7254" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><text x="425" y="130" font-family="Arial,sans-serif" font-size="20" font-weight="500" text-anchor="middle" fill="#293e32">leave room</text><text x="320" y="382" font-family="Arial,sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#293e32">Plan the door, path and garden</text></svg>