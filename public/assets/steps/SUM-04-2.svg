<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc"><title id="title">Leaf-and-twig insects: Place the body</title><desc id="desc">Put the twig down the middle of the card. Use a short tape strip across each end to hold it to the card. Leave space on both sides for wings.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#bd7254" stroke-width="2"/></marker></defs><rect width="640" height="420" rx="24" fill="#f8f6ee"/><rect x="100" y="90" width="440" height="245" rx="3" fill="#fffef7" stroke="#b8b4a4" stroke-width="3"/><g transform="translate(320 210) rotate(90)"><line x1="-70.0" y1="0" x2="70.0" y2="0" stroke="#8c684e" stroke-width="12" stroke-linecap="round"/><line x1="-64.0" y1="-2" x2="65.0" y2="-2" stroke="#b7906b" stroke-width="2" stroke-linecap="round"/><line x1="-22.400000000000002" y1="0" x2="-34.400000000000006" y2="-16" stroke="#8c684e" stroke-width="4.800000000000001" stroke-linecap="round"/></g><g transform="translate(320 145) rotate(0)"><rect x="-21.0" y="-9.0" width="42" height="18" rx="2" fill="#ecd8a3" stroke="#c5ab72" stroke-width="1.5"/><line x1="-14.7" y1="0" x2="14.7" y2="0" stroke="#c5ab72" stroke-width="1" stroke-linecap="round"/></g><g transform="translate(320 277) rotate(0)"><rect x="-21.0" y="-9.0" width="42" height="18" rx="2" fill="#ecd8a3" stroke="#c5ab72" stroke-width="1.5"/><line x1="-14.7" y1="0" x2="14.7" y2="0" stroke="#c5ab72" stroke-width="1" stroke-linecap="round"/></g><path d="M450 190 L350 193" fill="none" stroke="#bd7254" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><text x="453" y="170" font-family="Arial,sans-serif" font-size="20" font-weight="500" text-anchor="middle" fill="#293e32">tape both ends</text><text x="320" y="382" font-family="Arial,sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#293e32">Keep room on both sides</text></svg>