<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc"><title id="title">Pebble picture friends: Imagine the picture</title><desc id="desc">Choose a dragonfly, bird or turtle. Lightly draw its shape on the card, or point to where the body and head will go. Leave a clear border.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#bd7254" stroke-width="2"/></marker></defs><rect width="640" height="420" rx="24" fill="#f8f6ee"/><rect x="100" y="95" width="440" height="235" rx="3" fill="#fffef7" stroke="#b8b4a4" stroke-width="3"/><ellipse cx="320" cy="210" rx="37" ry="70" fill="none" stroke="#aaa58f" stroke-width="2"/><path d="M300 180 Q190 115 185 195 Q205 235 295 212 M340 180 Q450 115 455 195 Q435 235 345 212" fill="none" stroke="#aaa58f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="320" y="306" font-family="Arial,sans-serif" font-size="20" font-weight="500" text-anchor="middle" fill="#293e32">dragonfly plan</text><text x="320" y="382" font-family="Arial,sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#293e32">Choose a simple picture</text></svg>