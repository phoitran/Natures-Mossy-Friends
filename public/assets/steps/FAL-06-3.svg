<svg xmlns="http://www.w3.org/2000/svg" width="960" height="630" viewBox="0 0 960 630" role="img" aria-labelledby="title desc"><title id="title">Make a Leafy Friend — step 3: Layer ears, wings and tails</title><desc id="desc">Overlap smaller leaves to build ears, wings, a tail or fluffy-looking fur. A row of yellow leaves can become owl feathers. Keep moving the pieces until your friend feels like yours.</desc><defs>
