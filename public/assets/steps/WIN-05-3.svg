<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc"><title id="title">A snowy pinecone forest: Make a light snow dab</title><desc id="desc">Put one teaspoon of paint on a scrap of card. Touch the sponge to the paint, then dab once on the scrap so it is not dripping.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#bd7254" stroke-width="2"/></marker></defs><rect width="640" height="420" rx="24" fill="#f8f6ee"/><rect x="100" y="185" width="160" height="110" rx="3" fill="#d7bca0" stroke="#8c684e" stroke-width="3"/><ellipse cx="180" cy="236" rx="50" ry="25" fill="#fffefa" stroke="#ccc" stroke-width="2"/><rect x="360" y="132" width="80" height="50" rx="8" fill="#d9a54b" stroke="#8c684e" stroke-width="3"/><path d="M350 190 L249 230" fill="none" stroke="#bd7254" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><text x="404" y="110" font-family="Arial,sans-serif" font-size="20" font-weight="500" text-anchor="middle" fill="#293e32">load a little paint</text><text x="180" y="330" font-family="Arial,sans-serif" font-size="20" font-weight="500" text-anchor="middle" fill="#293e32">dab excess onto scrap</text><text x="320" y="382" font-family="Arial,sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#293e32">Use about one teaspoon of washable paint</text></svg>