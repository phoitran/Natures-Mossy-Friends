<svg xmlns="http://www.w3.org/2000/svg" width="960" height="630" viewBox="0 0 960 630" role="img" aria-labelledby="title desc"><title id="title">Spring Fairy Garden — step 2: Lean a little twig shelter</title><desc id="desc">Rest short twigs diagonally against the trunk so their feet spread out on the ground. Brace the feet with small stable stones and leave an opening at the front. Add a few more leaning twigs close together to support the roof. Test gently and lower any pieces that wobble.</desc><defs>
