<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc"><title id="title">Pressed-flower bookmarks: Seal the back and finish</title><desc id="desc">Apply the second film piece to the back. Fold its edges around to the front and smooth them flat. An adult trims any sticky overhang. Check the bookmark has smooth edges before putting it in a book.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#bd7254" stroke-width="2"/></marker></defs><rect width="640" height="420" rx="24" fill="#f8f6ee"/><rect x="250" y="105" width="130" height="230" rx="3" fill="#fffef7" stroke="#b8b4a4" stroke-width="3"/><ellipse cx="330.6" cy="175.0" rx="10.799999999999999" ry="10.799999999999999" fill="#e8c1b7" stroke="#bd7254" stroke-width="1.5"/><ellipse cx="322.8" cy="188.50999629903725" rx="10.799999999999999" ry="10.799999999999999" fill="#e8c1b7" stroke="#bd7254" stroke-width="1.5"/><ellipse cx="307.2" cy="188.50999629903725" rx="10.799999999999999" ry="10.799999999999999" fill="#e8c1b7" stroke="#bd7254" stroke-width="1.5"/><ellipse cx="299.4" cy="175.0" rx="10.799999999999999" ry="10.799999999999999" fill="#e8c1b7" stroke="#bd7254" stroke-width="1.5"/><ellipse cx="307.2" cy="161.49000370096277" rx="10.799999999999999" ry="10.799999999999999" fill="#e8c1b7" stroke="#bd7254" stroke-width="1.5"/><ellipse cx="322.8" cy="161.49000370096275" rx="10.799999999999999" ry="10.799999999999999" fill="#e8c1b7" stroke="#bd7254" stroke-width="1.5"/><circle cx="315" cy="175" r="8.4" fill="#d9a54b" stroke="#bd7254" stroke-width="1.5"/><g transform="translate(315 255) rotate(-25)"><path d="M0 -30.0 C28.799999999999997 -15.0 24.0 19.2 0 30.0 C-24.0 19.2 -28.799999999999997 -15.0 0 -30.0 Z" fill="#729769" stroke="#355344" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="0" y1="-21.599999999999998" x2="0" y2="36.0" stroke="#355344" stroke-width="2" stroke-linecap="round"/><line x1="0" y1="-12.0" x2="-11.4" y2="-21.0" stroke="#355344" stroke-width="1.5" stroke-linecap="round"/><line x1="0" y1="-12.0" x2="11.4" y2="-21.0" stroke="#355344" stroke-width="1.5" stroke-linecap="round"/><line x1="0" y1="0" x2="-11.4" y2="-9.0" stroke="#355344" stroke-width="1.5" stroke-linecap="round"/><line x1="0" y1="0" x2="11.4" y2="-9.0" stroke="#355344" stroke-width="1.5" stroke-linecap="round"/><line x1="0" y1="12.0" x2="-11.4" y2="3.0" stroke="#355344" stroke-width="1.5" stroke-linecap="round"/><line x1="0" y1="12.0" x2="11.4" y2="3.0" stroke="#355344" stroke-width="1.5" stroke-linecap="round"/></g><rect x="240" y="95" width="150" height="250" rx="5" fill="none" stroke="#8ea7b2" stroke-width="3"/><text x="479" y="190" font-family="Arial,sans-serif" font-size="20" font-weight="500" text-anchor="middle" fill="#293e32">smooth edges</text><path d="M435 210 L390 248" fill="none" stroke="#bd7254" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><text x="320" y="382" font-family="Arial,sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#293e32">Seal both sides; adult trims edges</text></svg>