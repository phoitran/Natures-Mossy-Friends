<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc"><title id="title">Meet the mud creatures: Mix a little mud</title><desc id="desc">Put one cup of soil in the bowl. Add one tablespoon of water and stir. Repeat only until a squeezed handful holds together. Use less than the full quarter-cup if it already holds.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#bd7254" stroke-width="2"/></marker></defs><rect width="640" height="420" rx="24" fill="#f8f6ee"/><rect x="95" y="210" width="450" height="110" rx="22" fill="#f2eadc" stroke="#b09b79" stroke-width="3"/><rect x="105" y="220" width="430" height="90" rx="16" fill="#faf5e9" stroke="#d1c2a7" stroke-width="2"/><path d="M190 190 L210 275 Q310 315 410 275 L430 190 Z" fill="#d7bca0" stroke="#8c684e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="310" cy="190" rx="120" ry="30" fill="#94765b" stroke="#8c684e" stroke-width="3"/><path d="M295 110 Q315 148 299 162 Q279 155 295 110" fill="#dcecf1" stroke="#8ea7b2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M300 167 L302 190" fill="none" stroke="#bd7254" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><g transform="translate(390 156) rotate(-40)"><line x1="-50.0" y1="0" x2="50.0" y2="0" stroke="#8c684e" stroke-width="7" stroke-linecap="round"/><line x1="-44.0" y1="-2" x2="45.0" y2="-2" stroke="#b7906b" stroke-width="2" stroke-linecap="round"/><line x1="-16.0" y1="0" x2="-28.0" y2="-16" stroke="#8c684e" stroke-width="2.8000000000000003" stroke-linecap="round"/></g><text x="140" y="142" font-family="Arial,sans-serif" font-size="20" font-weight="500" text-anchor="middle" fill="#293e32">water a little</text><text x="140" y="166" font-family="Arial,sans-serif" font-size="20" font-weight="500" text-anchor="middle" fill="#293e32">at a time</text><text x="320" y="382" font-family="Arial,sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#293e32">Stop when a squeezed handful holds</text></svg>