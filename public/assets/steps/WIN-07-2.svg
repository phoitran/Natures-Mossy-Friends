#8b9fa7" stroke-width="3" /><rect x="-38" y="25" width="75" height="82" rx="7" fill="#fffef9" stroke="#8b9fa7" stroke-width="3" /></g><text x="213" y="203" font-family="Trebuchet MS, DejaVu Sans, Arial, sans-serif" text-anchor="middle" font-size="24" font-weight="600" fill="#3c5240">Pinch a roof ridge</text><path d="M215 222 Q209.0 252.0 203 282" fill="none" stroke="#c76f5b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="496" y="242" font-family="Trebuchet MS, DejaVu Sans, Arial, sans-serif" text-anchor="middle" font-size="23" font-weight="600" fill="#3c5240">Round and flat-topped</text><path d="M493 260 Q493.0 290.0 493 320" fill="none" stroke="#c76f5b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="774" y="224" font-family="Trebuchet MS, DejaVu Sans, Arial, sans-serif" text-anchor="middle" font-size="24" font-weight="600" fill="#3c5240">Low blocks</text><path d="M773 242 Q773.0 296.0 773 350" fill="none" stroke="#c76f5b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="480" y="522" font-family="Trebuchet MS, DejaVu Sans, Arial, sans-serif" text-anchor="middle" font-size="24" font-weight="600" fill="#3c5240">Pack a cup or container, then turn it out.</text><text x="480" y="588" font-family="Trebuchet MS, DejaVu Sans, Arial, sans-serif" text-anchor="middle" font-size="28" font-weight="700" fill="#3c5240">Keep the bases broad and every building solid.</text></svg>