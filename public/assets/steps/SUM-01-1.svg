<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc"><title id="title">A twig treasure pot: Choose the base</title><desc id="desc">Choose a clean cardboard container with an intact bottom. Stand it on the table. Select twigs that reach no higher than its rim so they cannot poke hands reaching inside.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#bd7254" stroke-width="2"/></marker></defs><rect width="640" height="420" rx="24" fill="#f8f6ee"/><rect x="270" y="140" width="130" height="160" rx="6" fill="#d7bca0" stroke="#8c684e" stroke-width="3"/><ellipse cx="335" cy="141" rx="65" ry="22" fill="#9d8062" stroke="#8c684e" stroke-width="3"/><g transform="translate(190 215) rotate(90)"><line x1="-75.0" y1="0" x2="75.0" y2="0" stroke="#8c684e" stroke-width="12" stroke-linecap="round"/><line x1="-69.0" y1="-2" x2="70.0" y2="-2" stroke="#b7906b" stroke-width="2" stroke-linecap="round"/><line x1="-24.0" y1="0" x2="-36.0" y2="-16" stroke="#8c684e" stroke-width="4.800000000000001" stroke-linecap="round"/></g><line x1="168" y1="139" x2="235" y2="139" stroke="#bd7254" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 5"/><text x="190" y="105" font-family="Arial,sans-serif" font-size="20" font-weight="500" text-anchor="middle" fill="#293e32">below the rim</text><text x="320" y="382" font-family="Arial,sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#293e32">The container supplies the structure</text></svg>