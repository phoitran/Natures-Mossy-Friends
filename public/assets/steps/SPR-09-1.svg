<svg xmlns="http://www.w3.org/2000/svg" width="960" height="630" viewBox="0 0 960 630" role="img" aria-labelledby="title desc"><title id="title">Spring Fairy Garden — step 1: Choose a tree-side corner</title><desc id="desc">With a grown-up, find a permitted clear spot at the base of a tree. Use the trunk as the back of your tiny garden without digging or moving roots. Mark out a doorway and a path with loose twigs. A stable rock can be an alternative support.</desc><defs>
