<svg xmlns="http://www.w3.org/2000/svg" width="960" height="630" viewBox="0 0 960 630" role="img" aria-labelledby="title desc"><title id="title">A summer nature mandala — step 1: Gather and sort your treasures</title><desc id="desc">With a grown-up, collect loose leaves, smooth stones and any approved twigs, flowers or petals. Sort them into little piles by colour, shape or size. Choose a flat place with enough space for your circles to grow.</desc><defs>
