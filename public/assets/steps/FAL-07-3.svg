<svg xmlns="http://www.w3.org/2000/svg" width="960" height="630" viewBox="0 0 960 630" role="img" aria-labelledby="title desc"><title id="title">Fall Fairy Garden — step 3: Mix a little mud paste</title><desc id="desc">Put a few spoonfuls of soil in the bowl. Add water a little at a time and stir until it is thick, not runny. Try a small dab on two leaves. Some soil will not stick well; twigs will still support the roof.</desc><defs>
