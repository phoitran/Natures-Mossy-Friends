<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc"><title id="title">Winter twig stars: Make a five-point guide</title><desc id="desc">Draw five dots around a circle on paper: one at the top, two at the sides and two lower down. Number them around the circle 1 to 5. Join 1 to 3 to 5 to 2 to 4 to 1.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#bd7254" stroke-width="2"/></marker></defs><rect width="640" height="420" rx="24" fill="#f8f6ee"/><rect x="160" y="75" width="320" height="270" rx="3" fill="#fffef7" stroke="#b8b4a4" stroke-width="3"/><circle cx="320" cy="105" r="5" fill="#729769" stroke="#729769" stroke-width="1"/><text x="335" y="95" font-family="Arial,sans-serif" font-size="19" font-weight="500" text-anchor="middle" fill="#293e32">1</text><circle cx="442" cy="193" r="5" fill="#729769" stroke="#729769" stroke-width="1"/><text x="457" y="183" font-family="Arial,sans-serif" font-size="19" font-weight="500" text-anchor="middle" fill="#293e32">2</text><circle cx="395" cy="330" r="5" fill="#729769" stroke="#729769" stroke-width="1"/><text x="410" y="320" font-family="Arial,sans-serif" font-size="19" font-weight="500" text-anchor="middle" fill="#293e32">3</text><circle cx="245" cy="330" r="5" fill="#729769" stroke="#729769" stroke-width="1"/><text x="230" y="320" font-family="Arial,sans-serif" font-size="19" font-weight="500" text-anchor="middle" fill="#293e32">4</text><circle cx="198" cy="193" r="5" fill="#729769" stroke="#729769" stroke-width="1"/><text x="183" y="183" font-family="Arial,sans-serif" font-size="19" font-weight="500" text-anchor="middle" fill="#293e32">5</text><line x1="320" y1="105" x2="395" y2="330" stroke="#a1ae98" stroke-width="2" stroke-linecap="round"/><line x1="395" y1="330" x2="198" y2="193" stroke="#a1ae98" stroke-width="2" stroke-linecap="round"/><line x1="198" y1="193" x2="442" y2="193" stroke="#a1ae98" stroke-width="2" stroke-linecap="round"/><line x1="442" y1="193" x2="245" y2="330" stroke="#a1ae98" stroke-width="2" stroke-linecap="round"/><line x1="245" y1="330" x2="320" y2="105" stroke="#a1ae98" stroke-width="2" stroke-linecap="round"/><text x="320" y="382" font-family="Arial,sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#293e32">Join dots 1–3–5–2–4–1</text></svg>