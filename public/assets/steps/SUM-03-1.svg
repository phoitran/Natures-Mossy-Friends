<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc"><title id="title">Pebble picture friends: Sort your pebble shapes</title><desc id="desc">Set the cardboard on a flat surface. Sort stones into long, round and flat shapes. Pick a large body stone and two to four matching shapes for wings or legs.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#bd7254" stroke-width="2"/></marker></defs><rect width="640" height="420" rx="24" fill="#f8f6ee"/><rect x="100" y="95" width="440" height="235" rx="3" fill="#fffef7" stroke="#b8b4a4" stroke-width="3"/><ellipse cx="150" cy="175" rx="35" ry="25" fill="#b9bdb1" stroke="#758578" stroke-width="2"/><ellipse cx="225" cy="245" rx="25" ry="18" fill="#b9bdb1" stroke="#758578" stroke-width="2"/><ellipse cx="300" cy="175" rx="35" ry="25" fill="#b9bdb1" stroke="#758578" stroke-width="2"/><ellipse cx="375" cy="245" rx="25" ry="18" fill="#b9bdb1" stroke="#758578" stroke-width="2"/><ellipse cx="450" cy="175" rx="35" ry="25" fill="#b9bdb1" stroke="#758578" stroke-width="2"/><text x="320" y="300" font-family="Arial,sans-serif" font-size="20" font-weight="500" text-anchor="middle" fill="#293e32">long · round · flat</text><text x="320" y="382" font-family="Arial,sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#293e32">Sort smooth stones by shape</text></svg>