<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc"><title id="title">Leaf-rubbing discoveries: Hide it under paper</title><desc id="desc">Lay a sheet of thin paper over the leaf. Put a small piece of paper tape at two corners of the sheet to keep it from sliding.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#bd7254" stroke-width="2"/></marker></defs><rect width="640" height="420" rx="24" fill="#f8f6ee"/><g transform="translate(270 200) rotate(20)"><path d="M0 -70.0 C67.2 -35.0 56.0 44.800000000000004 0 70.0 C-56.0 44.800000000000004 -67.2 -35.0 0 -70.0 Z" fill="#729769" stroke="#355344" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="0" y1="-50.4" x2="0" y2="84.0" stroke="#355344" stroke-width="2" stroke-linecap="round"/><line x1="0" y1="-28.0" x2="-26.6" y2="-49.0" stroke="#355344" stroke-width="1.5" stroke-linecap="round"/><line x1="0" y1="-28.0" x2="26.6" y2="-49.0" stroke="#355344" stroke-width="1.5" stroke-linecap="round"/><line x1="0" y1="0" x2="-26.6" y2="-21.0" stroke="#355344" stroke-width="1.5" stroke-linecap="round"/><line x1="0" y1="0" x2="26.6" y2="-21.0" stroke="#355344" stroke-width="1.5" stroke-linecap="round"/><line x1="0" y1="28.0" x2="-26.6" y2="7.0" stroke="#355344" stroke-width="1.5" stroke-linecap="round"/><line x1="0" y1="28.0" x2="26.6" y2="7.0" stroke="#355344" stroke-width="1.5" stroke-linecap="round"/></g><rect x="330" y="112" width="210" height="200" rx="3" fill="#fffef7" stroke="#b8b4a4" stroke-width="3"/><path d="M305 210 L354 210" fill="none" stroke="#bd7254" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><text x="215" y="305" font-family="Arial,sans-serif" font-size="20" font-weight="500" text-anchor="middle" fill="#293e32">leaf underneath</text><g transform="translate(350 125) rotate(-30)"><rect x="-20.0" y="-10.0" width="40" height="20" rx="2" fill="#ecd8a3" stroke="#c5ab72" stroke-width="1.5"/><line x1="-14.0" y1="0" x2="14.0" y2="0" stroke="#c5ab72" stroke-width="1" stroke-linecap="round"/></g><g transform="translate(521 292) rotate(-30)"><rect x="-20.0" y="-10.0" width="40" height="20" rx="2" fill="#ecd8a3" stroke="#c5ab72" stroke-width="1.5"/><line x1="-14.0" y1="0" x2="14.0" y2="0" stroke="#c5ab72" stroke-width="1" stroke-linecap="round"/></g><text x="320" y="382" font-family="Arial,sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#293e32">Cover the leaf and tape the paper</text></svg>