<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc"><title id="title">A pocket-sized snow village: Connect the village</title><desc id="desc">Use the blunt twig to trace a shallow path between houses. Press a door and window shape onto each surface without hollowing out the buildings. Add a small snow courtyard if you like.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#bd7254" stroke-width="2"/></marker></defs><rect width="640" height="420" rx="24" fill="#f8f6ee"/><path d="M45 303 Q135 288 220 306 Q350 288 450 304 Q530 294 595 304" fill="none" stroke="#a4bbc4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><polygon points="180,300 192,160 293,160 305,300" fill="#fffefa" stroke="#9fbac4" stroke-width="3" stroke-linejoin="round"/><ellipse cx="242.5" cy="160" rx="50.5" ry="13" fill="#fffefa" stroke="#9fbac4" stroke-width="3"/><polygon points="385,300 397,190 483,190 495,300" fill="#fffefa" stroke="#9fbac4" stroke-width="3" stroke-linejoin="round"/><ellipse cx="440.0" cy="190" rx="43.0" ry="13" fill="#fffefa" stroke="#9fbac4" stroke-width="3"/><path d="M255 299 Q320 260 407 300" fill="none" stroke="#9fbac4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="226" y="255" width="25" height="44" rx="3" fill="none" stroke="#9fbac4" stroke-width="2"/><rect x="422" y="259" width="24" height="40" rx="3" fill="none" stroke="#9fbac4" stroke-width="2"/><text x="320" y="105" font-family="Arial,sans-serif" font-size="20" font-weight="500" text-anchor="middle" fill="#293e32">shallow surface details only</text><text x="320" y="382" font-family="Arial,sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#293e32">Connect solid houses with a shallow path</text></svg>