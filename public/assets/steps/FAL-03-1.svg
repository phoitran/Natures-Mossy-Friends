<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc"><title id="title">Pinecone woodland friends: Make a stable base</title><desc id="desc">Flatten the clay into a disc about 6 cm wide on the card. Press the wide end of the pinecone into it. If making a hedgehog, lay the cone sideways and press it gently into the clay.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#bd7254" stroke-width="2"/></marker></defs><rect width="640" height="420" rx="24" fill="#f8f6ee"/><ellipse cx="320" cy="294" rx="95" ry="22" fill="#dce7d0" stroke="#729769" stroke-width="3"/><g transform="translate(320 215) scale(1.0)"><ellipse cx="0" cy="0" rx="42" ry="70" fill="#8c684e" stroke="#604d3b" stroke-width="3"/><path d="M-29.5 -46 Q-12.5 -19 4.5 -46" fill="#d7bca0" stroke="#72563f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M-4.5 -46 Q12.5 -19 29.5 -46" fill="#d7bca0" stroke="#72563f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M-42.0 -23 Q-25.0 4 -8.0 -23" fill="#d7bca0" stroke="#72563f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M-17.0 -23 Q0.0 4 17.0 -23" fill="#d7bca0" stroke="#72563f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M8.0 -23 Q25.0 4 42.0 -23" fill="#d7bca0" stroke="#72563f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M-42.0 0 Q-25.0 27 -8.0 0" fill="#d7bca0" stroke="#72563f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M-17.0 0 Q0.0 27 17.0 0" fill="#d7bca0" stroke="#72563f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M8.0 0 Q25.0 27 42.0 0" fill="#d7bca0" stroke="#72563f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M-42.0 23 Q-25.0 50 -8.0 23" fill="#d7bca0" stroke="#72563f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M-17.0 23 Q0.0 50 17.0 23" fill="#d7bca0" stroke="#72563f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M8.0 23 Q25.0 50 42.0 23" fill="#d7bca0" stroke="#72563f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M-29.5 46 Q-12.5 73 4.5 46" fill="#d7bca0" stroke="#72563f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M-4.5 46 Q12.5 73 29.5 46" fill="#d7bca0" stroke="#72563f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M320 105 L320 130" fill="none" stroke="#bd7254" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><text x="477" y="290" font-family="Arial,sans-serif" font-size="20" font-weight="500" text-anchor="middle" fill="#293e32">clay base</text><text x="320" y="382" font-family="Arial,sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#293e32">A broad clay disc keeps the cone steady</text></svg>