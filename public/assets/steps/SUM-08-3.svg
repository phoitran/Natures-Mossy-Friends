<svg xmlns="http://www.w3.org/2000/svg" width="960" height="630" viewBox="0 0 960 630" role="img" aria-labelledby="title desc"><title id="title">Our wilderness creatures — step 3: Add limbs, wings or a tail</title><desc id="desc">Lay short twigs for arms and legs. Slide their ends under the body to help keep them in place. Overlap leaves for ears, wings or a tail. A pair of broad leaves can make butterfly wings, while thin twigs can make a bird’s legs.</desc><defs>
