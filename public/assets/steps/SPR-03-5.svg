y="Arial,sans-serif" font-size="20" font-weight="500" text-anchor="middle" fill="#293e32">Hello, muddy friend!</text><text x="320" y="382" font-family="Arial,sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#293e32">Wash hands with soap and water</text></svg>