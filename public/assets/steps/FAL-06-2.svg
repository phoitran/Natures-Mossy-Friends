<svg xmlns="http://www.w3.org/2000/svg" width="960" height="630" viewBox="0 0 960 630" role="img" aria-labelledby="title desc"><title id="title">Make a Leafy Friend — step 2: Give your friend a body</title><desc id="desc">Lay a large leaf flat for the body. Try a smaller leaf above or beside it for the head. Turn the leaves around until you see a fox, owl, bird or an invented creature.</desc><defs>
