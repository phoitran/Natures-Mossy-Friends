<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc"><title id="title">Leaf-rubbing discoveries: Turn the crayon sideways</title><desc id="desc">Lay the broad side of the crayon on the paper. Hold the paper with the other hand. Make two gentle practice strokes beside the leaf.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#bd7254" stroke-width="2"/></marker></defs><rect width="640" height="420" rx="24" fill="#f8f6ee"/><rect x="170" y="100" width="300" height="215" rx="3" fill="#fffef7" stroke="#b8b4a4" stroke-width="3"/><g transform="translate(330 185) rotate(-20)"><rect x="-60" y="-10" width="120" height="20" rx="4" fill="#d9a54b" stroke="#a77d38" stroke-width="3"/></g><path d="M255 237 L388 237" fill="none" stroke="#bd7254" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><text x="320" y="285" font-family="Arial,sans-serif" font-size="20" font-weight="500" text-anchor="middle" fill="#293e32">use the broad side</text><text x="320" y="382" font-family="Arial,sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#293e32">Hold the paper still with one hand</text></svg>