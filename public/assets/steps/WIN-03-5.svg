<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc"><title id="title">Pictures in the snow: Give the picture a name</title><desc id="desc">Stand beside the picture and look down at the shapes and shadows. Name it, collect the twig and take a warm-up break. Leave only snow behind.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#bd7254" stroke-width="2"/></marker></defs><rect width="640" height="420" rx="24" fill="#f8f6ee"/><ellipse cx="320" cy="220" rx="235" ry="105" fill="#edf5f7" stroke="#b8cbd1" stroke-width="3"/><ellipse cx="320" cy="220" rx="95" ry="65" fill="#fffefa" stroke="#a4bbc4" stroke-width="3"/><polygon points="248,185 241,133 281,163" fill="#fffefa" stroke="#a4bbc4" stroke-width="3" stroke-linejoin="round"/><polygon points="359,165 400,133 393,187" fill="#fffefa" stroke="#a4bbc4" stroke-width="3" stroke-linejoin="round"/><circle cx="297.2" cy="215" r="5.699999999999999" fill="#293e32" stroke="#293e32" stroke-width="1"/><circle cx="342.8" cy="215" r="5.699999999999999" fill="#293e32" stroke="#293e32" stroke-width="1"/><path d="M297.2 237.8 Q320 262.5 342.8 237.8" fill="none" stroke="#293e32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M254 235 L275 238 M253 250 L273 247 M367 238 L390 233 M369 250 L391 253" fill="none" stroke="#9fbac4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="320" y="112" font-family="Arial,sans-serif" font-size="20" font-weight="500" text-anchor="middle" fill="#293e32">Hello, snowy friend!</text><text x="320" y="382" font-family="Arial,sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#293e32">Collect the twig before leaving</text></svg>