<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc"><title id="title">A spring nature crown: Make a band</title><desc id="desc">Lay the two card strips end to end with a 3 cm overlap. Tape both sides of the overlap. Keep the band flat until the leaves are attached.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#bd7254" stroke-width="2"/></marker></defs><rect width="640" height="420" rx="24" fill="#f8f6ee"/><rect x="70" y="180" width="270" height="55" rx="2" fill="#d7bca0" stroke="#8c684e" stroke-width="3"/><rect x="305" y="180" width="270" height="55" rx="2" fill="#d7bca0" stroke="#8c684e" stroke-width="3"/><g transform="translate(322 207) rotate(0)"><rect x="-21.0" y="-35.0" width="42" height="70" rx="2" fill="#ecd8a3" stroke="#c5ab72" stroke-width="1.5"/><line x1="-14.7" y1="0" x2="14.7" y2="0" stroke="#c5ab72" stroke-width="1" stroke-linecap="round"/></g><path d="M245 135 L311 175" fill="none" stroke="#bd7254" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><text x="210" y="120" font-family="Arial,sans-serif" font-size="20" font-weight="500" text-anchor="middle" fill="#293e32">3 cm overlap</text><text x="320" y="382" font-family="Arial,sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#293e32">Join two 5 cm-wide paper strips</text></svg>