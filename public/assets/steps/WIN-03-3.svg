<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc"><title id="title">Pictures in the snow: Add low raised shapes</title><desc id="desc">Place small handfuls of snow inside the outline. Press them into shallow mounds no more than about 3 cm high. Add round cheeks, petals or two broad ears.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#bd7254" stroke-width="2"/></marker></defs><rect width="640" height="420" rx="24" fill="#f8f6ee"/><ellipse cx="320" cy="220" rx="235" ry="105" fill="#edf5f7" stroke="#b8cbd1" stroke-width="3"/><ellipse cx="320" cy="220" rx="95" ry="65" fill="#fffefa" stroke="#a4bbc4" stroke-width="3"/><polygon points="248,185 241,133 281,163" fill="#fffefa" stroke="#a4bbc4" stroke-width="3" stroke-linejoin="round"/><polygon points="359,165 400,133 393,187" fill="#fffefa" stroke="#a4bbc4" stroke-width="3" stroke-linejoin="round"/><text x="320" y="112" font-family="Arial,sans-serif" font-size="20" font-weight="500" text-anchor="middle" fill="#293e32">low, thick shapes</text><text x="320" y="382" font-family="Arial,sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#293e32">Keep raised parts about 3 cm high</text></svg>