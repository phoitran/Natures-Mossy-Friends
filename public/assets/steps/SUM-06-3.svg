<svg xmlns="http://www.w3.org/2000/svg" width="960" height="630" viewBox="0 0 960 630" role="img" aria-labelledby="title desc"><title id="title">A summer nature mandala — step 3: Make a repeating first ring</title><desc id="desc">Place a circle of leaves or stones around your centre. Repeat one kind of piece, or alternate two colours or shapes. Keep going until the ring meets itself. Leave little gaps so each piece is easy to see.</desc><defs>
