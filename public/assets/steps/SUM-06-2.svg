Vu Sans, Arial, sans-serif" text-anchor="middle" font-size="24" font-weight="600" fill="#3c5240">Or a leaf</text><text x="480" y="588" font-family="Trebuchet MS, DejaVu Sans, Arial, sans-serif" text-anchor="middle" font-size="28" font-weight="700" fill="#3c5240">One centre piece is enough to begin.</text></svg>