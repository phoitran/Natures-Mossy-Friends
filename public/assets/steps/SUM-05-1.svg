<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc"><title id="title">A tiny twig sailboat: Line up the raft twigs</title><desc id="desc">Place five or six similar twigs side by side with their ends level. Leave a tiny gap between each. Set aside the shorter mast twig and leaf.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#bd7254" stroke-width="2"/></marker></defs><rect width="640" height="420" rx="24" fill="#f8f6ee"/><rect x="90" y="105" width="460" height="210" rx="22" fill="#f2eadc" stroke="#b09b79" stroke-width="3"/><rect x="100" y="115" width="440" height="190" rx="16" fill="#faf5e9" stroke="#d1c2a7" stroke-width="2"/><g transform="translate(320 155) rotate(0)"><line x1="-130.0" y1="0" x2="130.0" y2="0" stroke="#8c684e" stroke-width="20" stroke-linecap="round"/><line x1="-124.0" y1="-2" x2="125.0" y2="-2" stroke="#b7906b" stroke-width="2" stroke-linecap="round"/><line x1="-41.6" y1="0" x2="-53.6" y2="-16" stroke="#8c684e" stroke-width="8.0" stroke-linecap="round"/></g><g transform="translate(320 187) rotate(0)"><line x1="-130.0" y1="0" x2="130.0" y2="0" stroke="#8c684e" stroke-width="20" stroke-linecap="round"/><line x1="-124.0" y1="-2" x2="125.0" y2="-2" stroke="#b7906b" stroke-width="2" stroke-linecap="round"/><line x1="-41.6" y1="0" x2="-53.6" y2="-16" stroke="#8c684e" stroke-width="8.0" stroke-linecap="round"/></g><g transform="translate(320 219) rotate(0)"><line x1="-130.0" y1="0" x2="130.0" y2="0" stroke="#8c684e" stroke-width="20" stroke-linecap="round"/><line x1="-124.0" y1="-2" x2="125.0" y2="-2" stroke="#b7906b" stroke-width="2" stroke-linecap="round"/><line x1="-41.6" y1="0" x2="-53.6" y2="-16" stroke="#8c684e" stroke-width="8.0" stroke-linecap="round"/></g><g transform="translate(320 251) rotate(0)"><line x1="-130.0" y1="0" x2="130.0" y2="0" stroke="#8c684e" stroke-width="20" stroke-linecap="round"/><line x1="-124.0" y1="-2" x2="125.0" y2="-2" stroke="#b7906b" stroke-width="2" stroke-linecap="round"/><line x1="-41.6" y1="0" x2="-53.6" y2="-16" stroke="#8c684e" stroke-width="8.0" stroke-linecap="round"/></g><g transform="translate(320 283) rotate(0)"><line x1="-130.0" y1="0" x2="130.0" y2="0" stroke="#8c684e" stroke-width="20" stroke-linecap="round"/><line x1="-124.0" y1="-2" x2="125.0" y2="-2" stroke="#b7906b" stroke-width="2" stroke-linecap="round"/><line x1="-41.6" y1="0" x2="-53.6" y2="-16" stroke="#8c684e" stroke-width="8.0" stroke-linecap="round"/></g><text x="320" y="90" font-family="Arial,sans-serif" font-size="20" font-weight="500" text-anchor="middle" fill="#293e32">five or six similar twigs</text><text x="320" y="382" font-family="Arial,sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#293e32">Line up the ends before tying</text></svg>