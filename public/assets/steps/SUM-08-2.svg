<svg xmlns="http://www.w3.org/2000/svg" width="960" height="630" viewBox="0 0 960 630" role="img" aria-labelledby="title desc"><title id="title">Our wilderness creatures — step 2: Start with the biggest shapes</title><desc id="desc">Lay a broad piece of fallen bark, a leaf or a flat stone down for the body. It can be the face too, or you can add a smaller head beside it. Turn the pieces until you find a shape you like. Keep the design flat so it does not need to balance.</desc><defs>
