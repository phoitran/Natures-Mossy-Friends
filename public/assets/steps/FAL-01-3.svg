<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc"><title id="title">A little autumn leaf loom: Add five weaving strands</title><desc id="desc">Tie five strings from the top twig to the bottom twig, spaced about 2 cm apart. Keep them snug but not so tight that the frame bends. An adult trims long tails.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#bd7254" stroke-width="2"/></marker></defs><rect width="640" height="420" rx="24" fill="#f8f6ee"/><g transform="translate(320 118) rotate(0)"><line x1="-130.0" y1="0" x2="130.0" y2="0" stroke="#8c684e" stroke-width="12" stroke-linecap="round"/><line x1="-124.0" y1="-2" x2="125.0" y2="-2" stroke="#b7906b" stroke-width="2" stroke-linecap="round"/><line x1="-41.6" y1="0" x2="-53.6" y2="-16" stroke="#8c684e" stroke-width="4.800000000000001" stroke-linecap="round"/></g><g transform="translate(320 310) rotate(0)"><line x1="-130.0" y1="0" x2="130.0" y2="0" stroke="#8c684e" stroke-width="12" stroke-linecap="round"/><line x1="-124.0" y1="-2" x2="125.0" y2="-2" stroke="#b7906b" stroke-width="2" stroke-linecap="round"/><line x1="-41.6" y1="0" x2="-53.6" y2="-16" stroke="#8c684e" stroke-width="4.800000000000001" stroke-linecap="round"/></g><g transform="translate(205 214) rotate(90)"><line x1="-110.0" y1="0" x2="110.0" y2="0" stroke="#8c684e" stroke-width="12" stroke-linecap="round"/><line x1="-104.0" y1="-2" x2="105.0" y2="-2" stroke="#b7906b" stroke-width="2" stroke-linecap="round"/><line x1="-35.2" y1="0" x2="-47.2" y2="-16" stroke="#8c684e" stroke-width="4.800000000000001" stroke-linecap="round"/></g><g transform="translate(435 214) rotate(90)"><line x1="-110.0" y1="0" x2="110.0" y2="0" stroke="#8c684e" stroke-width="12" stroke-linecap="round"/><line x1="-104.0" y1="-2" x2="105.0" y2="-2" stroke="#b7906b" stroke-width="2" stroke