<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc"><title id="title">Meet the mud creatures: Press in a personality</title><desc id="desc">Use the blunt end of the twig to make two shallow eye dents and a curved smile. Press short lines into the surface for fur or scales. Set the twig down between turns.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#bd7254" stroke-width="2"/></marker></defs><rect width="640" height="420" rx="24" fill="#f8f6ee"/><rect x="95" y="210" width="450" height="110" rx="22" fill="#f2eadc" stroke="#b09b79" stroke-width="3"/><rect x="105" y="220" width="430" height="90" rx="16" fill="#faf5e9" stroke="#d1c2a7" stroke-width="2"/><path d="M220 285 C220 245 220 177 300 178 C390 176 420 240 420 285 Z" fill="#94765b" stroke="#8c684e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="250,200 253,143 288,187" fill="#94765b" stroke="#8c684e" stroke-width="3" stroke-linejoin="round"/><polygon points="342,185 386,145 385,211" fill="#94765b" stroke="#8c684e" stroke-width="3" stroke-linejoin="round"/><circle cx="297.6" cy="225" r="5.1" fill="#293e32" stroke="#293e32" stroke-width="1"/><circle cx="338.4" cy="225" r="5.1" fill="#293e32" stroke="#293e32" stroke-width="1"/><path d="M297.6 245.4 Q318 267.5 338.4 245.4" fill="none" stroke="#293e32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="258" y1="258" x2="262" y2="271" stroke="#8c684e" stroke-width="3" stroke-linecap="round"/><line x1="277" y1="258" x2="281" y2="271" stroke="#8c684e" stroke-width="3" stroke-linecap="round"/><line x1="365" y1="258" x2="369" y2="271" stroke="#8c684e" stroke-width="3" stroke-linecap="round"/><line x1="385" y1="258" x2="389" y2="271" stroke="#8c684e" stroke-width="3" stroke-linecap="round"/><g transform="translate(460 170) rotate(-40)"><line x1="-60.0" y1="0" x2="60.0" y2="0" stroke="#8c684e" stroke-width="7" stroke-linecap="round"/><line x1="-54.0" y1="-2" x2="55.0" y2="-2" stroke="#b7906b" stroke-width="2" stroke-linecap="round"/><line x1="-19.2" y1="0" x2="-31.2" y2="-16" stroke="#8c684e" stroke-width="2.8000000000000003" stroke-linecap="round"/></g><path d="M403 214 L355 221" fill="none" stroke="#bd7254" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><text x="455" y="105" font-family="Arial,sans-serif" font-size="20" font-weight="500" text-anchor="middle" fill="#293e32">press, don’t pierce</text><text x="320" y="382" font-family="Arial,sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#293e32">Use a blunt twig for shallow marks</text></svg>