<svg xmlns="http://www.w3.org/2000/svg" width="960" height="630" viewBox="0 0 960 630" role="img" aria-labelledby="title desc"><title id="title">Meet the mud creatures — step 4: Bring your creature to life</title><desc id="desc">Gently push suitable stones into the mud for eyes or a nose. Add leaf ears, short twig spines, or grass and flowers for hair. Keep decorations light. Make a friendly smile, a silly frown or a monster face that makes you laugh.</desc><defs>
