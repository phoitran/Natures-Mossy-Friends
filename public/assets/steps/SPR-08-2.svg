="round" /><line x1="53" y1="-11" x2="53" y2="20" stroke="#b77e59" stroke-width="2" stroke-linecap="round" /><rect x="-19" y="68" width="66" height="29" rx="4" fill="#91a56c" stroke="#61483a" stroke-width="3" /></g><text x="737" y="466" font-family="Trebuchet MS, DejaVu Sans, Arial, sans-serif" text-anchor="middle" font-size="26" font-weight="600" fill="#3c5240">Holds together</text><text x="297" y="513" font-family="Trebuchet MS, DejaVu Sans, Arial, sans-serif" text-anchor="middle" font-size="25" font-weight="600" fill="#3c5240">More soil if it is runny</text><text x="480" y="588" font-family="Trebuchet MS, DejaVu Sans, Arial, sans-serif" text-anchor="middle" font-size="28" font-weight="700" fill="#3c5240">Try a flatter face if your soil keeps crumbling.</text></svg>