<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc"><title id="title">Meet the mud creatures: Pinch ears or a tail</title><desc id="desc">Use finger and thumb to pinch two ears from the same mound, or stretch one end into a short tail. Keep details thick and close to the body so they do not break off.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#bd7254" stroke-width="2"/></marker></defs><rect width="640" height="420" rx="24" fill="#f8f6ee"/><rect x="95" y="210" width="450" height="110" rx="22" fill="#f2eadc" stroke="#b09b79" stroke-width="3"/><rect x="105" y="220" width="430" height="90" rx="16" fill="#faf5e9" stroke="#d1c2a7" stroke-width="2"/><path d="M220 285 C220 245 220 177 300 178 C390 176 420 240 420 285 Z" fill="#94765b" stroke="#8c684e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="250,200 253,143 288,187" fill="#94765b" stroke="#8c684e" stroke-width="3" stroke-linejoin="round"/><polygon points="342,185 386,145 385,211" fill="#94765b" stroke="#8c684e" stroke-width="3" stroke-linejoin="round"/><path d="M442 125 L391 159" fill="none" stroke="#bd7254" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><text x="448" y="105" font-family="Arial,sans-serif" font-size="20" font-weight="500" text-anchor="middle" fill="#293e32">pinch thick ears</text><text x="320" y="382" font-family="Arial,sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#293e32">Shape details from the same mound</text></svg>