<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc"><title id="title">Pictures in the snow: Draw a broad outline</title><desc id="desc">Use the blunt twig to draw a large circle, flower or animal head. Keep the outline simple enough to follow with one finger.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#bd7254" stroke-width="2"/></marker></defs><rect width="640" height="420" rx="24" fill="#f8f6ee"/><ellipse cx="320" cy="220" rx="235" ry="105" fill="#edf5f7" stroke="#b8cbd1" stroke-width="3"/><ellipse cx="320" cy="220" rx="95" ry="65" fill="none" stroke="#a4bbc4" stroke-width="3"/><g transform="translate(465 145) rotate(-35)"><line x1="-60.0" y1="0" x2="60.0" y2="0" stroke="#8c684e" stroke-width="7" stroke-linecap="round"/><line x1="-54.0" y1="-2" x2="55.0" y2="-2" stroke="#b7906b" stroke-width="2" stroke-linecap="round"/><line x1="-19.2" y1="0" x2="-31.2" y2="-16" stroke="#8c684e" stroke-width="2.8000000000000003" stroke-linecap="round"/></g><path d="M421 179 L385 199" fill="none" stroke="#bd7254" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><text x="320" y="382" font-family="Arial,sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#293e32">Draw one simple, broad outline</text></svg>