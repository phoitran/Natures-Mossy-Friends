<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc"><title id="title">Pinecone woodland friends: Fold attachment tabs</title><desc id="desc">Fold about 1 cm at the base of each paper feature to make a small tab. Put a loop of paper tape on the tab. Keep the decorative part clear of the tape.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#bd7254" stroke-width="2"/></marker></defs><rect width="640" height="420" rx="24" fill="#f8f6ee"/><polygon points="150,140 250,190 150,240" fill="#d9a54b" stroke="#355344" stroke-width="3" stroke-linejoin="round"/><rect x="150" y="140" width="25" height="100" rx="0" fill="#d7bca0" stroke="#355344" stroke-width="2"/><line x1="175" y1="140" x2="175" y2="240" stroke="#bd7254" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 5"/><path d="M210 270 L167 247" fill="none" stroke="#bd7254" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><text x="310" y="300" font-family="Arial,sans-serif" font-size="20" font-weight="500" text-anchor="middle" fill="#293e32">fold a 1 cm tab</text><g transform="translate(425 190) rotate(0)"><rect x="-40.0" y="-15.0" width="80" height="30" rx="2" fill="#ecd8a3" stroke="#c5ab72" stroke-width="1.5"/><line x1="-28.0" y1="0" x2="28.0" y2="0" stroke="#c5ab72" stroke-width="1" stroke-linecap="round"/></g><path d="M390 185 Q430 125 465 185" fill="none" stroke="#c5ab72" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="425" y="250" font-family="Arial,sans-serif" font-size="20" font-weight="500" text-anchor="middle" fill="#293e32">tape loop</text><text x="320" y="382" font-family="Arial,sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#293e32">Tabs give each feature an attachment point</text></svg>