<svg xmlns="http://www.w3.org/2000/svg" width="960" height="630" viewBox="0 0 960 630" role="img" aria-labelledby="title desc"><title id="title">Snowy Friends — step 1: Choose a snowy creature</title><desc id="desc">Dress warmly and test a handful of snow with a grown-up. Choose mice, a rabbit, cat, bear, turtle or an invented creature. Think about its biggest shape first: an oval mouse, a seated animal or a low turtle shell. Snow that will not pack can wait for another day.</desc><defs>
