<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc"><title id="title">A pocket-sized snow village: Plan a small neighbourhood</title><desc id="desc">On flat snow, mark a patch about 50 cm across with the blunt twig. Draw where two houses and a path will go. Leave space to walk around the village.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#bd7254" stroke-width="2"/></marker></defs><rect width="640" height="420" rx="24" fill="#f8f6ee"/><path d="M45 303 Q135 288 220 306 Q350 288 450 304 Q530 294 595 304" fill="none" stroke="#a4bbc4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="120" y="122" width="135" height="100" rx="3" fill="none" stroke="#9fbac4" stroke-width="3"/><rect x="395" y="122" width="125" height="100" rx="3" fill="none" stroke="#9fbac4" stroke-width="3"/><path d="M180 240 Q320 330 453 241" fill="none" stroke="#9fbac4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="320" y="95" font-family="Arial,sans-serif" font-size="20" font-weight="500" text-anchor="middle" fill="#293e32">plan two houses and a path</text><text x="320" y="382" font-family="Arial,sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#293e32">Keep the whole village miniature</text></svg>