<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc"><title id="title">Pressed-flower bookmarks: Press and wait</title><desc id="desc">Cover with two more sheets of paper and close the book. Put it in a dry place under another heavy book. Check after 7 days; leave longer if pieces feel cool, soft or damp.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#bd7254" stroke-width="2"/></marker></defs><rect width="640" height="420" rx="24" fill="#f8f6ee"/><rect x="150" y="200" width="340" height="70" rx="5" fill="#d7bca0" stroke="#8c684e" stroke-width="3"/><rect x="150" y="185" width="340" height="20" rx="2" fill="#fffefa" stroke="#8c684e" stroke-width="3"/><rect x="170" y="140" width="300" height="45" rx="4" fill="#729769" stroke="#355344" stroke-width="3"/><text x="320" y="115" font-family="Arial,sans-serif" font-size="20" font-weight="500" text-anchor="middle" fill="#293e32">7–14 days or longer</text><text x="320" y="310" font-family="Arial,sans-serif" font-size="20" font-weight="500" text-anchor="middle" fill="#293e32">dry and papery before sealing</text><text x="320" y="382" font-family="Arial,sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#293e32">Press in a heavy book and wait</text></svg>