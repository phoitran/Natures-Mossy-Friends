<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc"><title id="title">Make a little snowman: Pack a broad base</title><desc id="desc">Pack a snow mound about 15 cm wide on flat ground. Round the sides with mittened hands and flatten the top slightly. Keep the base broad and low.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#bd7254" stroke-width="2"/></marker></defs><rect width="640" height="420" rx="24" fill="#f8f6ee"/><path d="M45 303 Q135 288 220 306 Q350 288 450 304 Q530 294 595 304" fill="none" stroke="#a4bbc4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="320" cy="260" r="65" fill="#f8fcfd" stroke="#9fbac4" stroke-width="3"/><path d="M277.75 271.7 Q294.0 302.25 329.75 304.2" fill="none" stroke="#d7e6eb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="320" y="133" font-family="Arial,sans-serif" font-size="20" font-weight="500" text-anchor="middle" fill="#293e32">broad, low base</text><line x1="255" y1="342" x2="385" y2="342" stroke="#bd7254" stroke-width="2" stroke-linecap="round"/><text x="320" y="365" font-family="Arial,sans-serif" font-size="20" font-weight="500" text-anchor="middle" fill="#293e32">about 15 cm wide</text></svg>