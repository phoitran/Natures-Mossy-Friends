<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc"><title id="title">Pebble picture friends: Place the big shapes</title><desc id="desc">Put the largest stones down first for the body and head. Leave space around them for wings, legs or a tail. Turn the stones until they sit flat.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#bd7254" stroke-width="2"/></marker></defs><rect width="640" height="420" rx="24" fill="#f8f6ee"/><rect x="100" y="95" width="440" height="235" rx="3" fill="#fffef7" stroke="#b8b4a4" stroke-width="3"/><ellipse cx="320" cy="160" rx="18" ry="17" fill="#b9bdb1" stroke="#758578" stroke-width="2"/><ellipse cx="320" cy="200" rx="18" ry="17" fill="#b9bdb1" stroke="#758578" stroke-width="2"/><ellipse cx="320" cy="240" rx="18" ry="17" fill="#b9bdb1" stroke="#758578" stroke-width="2"/><ellipse cx="320" cy="275" rx="18" ry="17" fill="#b9bdb1" stroke="#758578" stroke-width="2"/><path d="M455 188 L350 198" fill="none" stroke="#bd7254" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><text x="456" y="160" font-family="Arial,sans-serif" font-size="20" font-weight="500" text-anchor="middle" fill="#293e32">body first</text><text x="320" y="382" font-family="Arial,sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#293e32">Place the largest body pieces first</text></svg>