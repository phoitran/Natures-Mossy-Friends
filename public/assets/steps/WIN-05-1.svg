<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc"><title id="title">A snowy pinecone forest: Prepare three tree bases</title><desc id="desc">Flatten each piece of clay into a small disc on the tray. Space the three discs apart, leaving a clear path between them. Keep unused paint closed.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#bd7254" stroke-width="2"/></marker></defs><rect width="640" height="420" rx="24" fill="#f8f6ee"/><rect x="85" y="215" width="470" height="105" rx="22" fill="#f2eadc" stroke="#b09b79" stroke-width="3"/><rect x="95" y="225" width="450" height="85" rx="16" fill="#faf5e9" stroke="#d1c2a7" stroke-width="2"/><ellipse cx="190" cy="274" rx="43" ry="17" fill="#dce7d0" stroke="#729769" stroke-width="2"/><ellipse cx="330" cy="274" rx="43" ry="17" fill="#dce7d0" stroke="#729769" stroke-width="2"/><ellipse cx="460" cy="274" rx="43" ry="17" fill="#dce7d0" stroke="#729769" stroke-width="2"/><text x="320" y="137" font-family="Arial,sans-serif" font-size="20" font-weight="500" text-anchor="middle" fill="#293e32">leave space for a path</text><path d="M320 164 L320 230" fill="none" stroke="#bd7254" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><text x="320" y="382" font-family="Arial,sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#293e32">Press three broad, low clay bases</text></svg>