<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc"><title id="title">Winter twig stars: Tie the first two points</title><desc id="desc">At one outer point, wrap a short string around the two overlapping twig ends three times, then tie a double knot. Repeat at the next point while an adult holds the star flat.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#bd7254" stroke-width="2"/></marker></defs><rect width="640" height="420" rx="24" fill="#f8f6ee"/><g transform="translate(357.5 217.5) rotate(71.56505117707799)"><line x1="-128.5854122563142" y1="0" x2="128.5854122563142" y2="0" stroke="#8c684e" stroke-width="10" stroke-linecap="round"/><line x1="-122.58541225631421" y1="-2" x2="123.58541225631421" y2="-2" stroke="#b7906b" stroke-width="2" stroke-linecap="round"/><line x1="-41.14733192202055" y1="0" x2="-53.14733192202055" y2="-16" stroke="#8c684e" stroke-width="4.0" stroke-linecap="round"/></g><g transform="translate(296.5 261.5) rotate(-145.1840331960241)"><line x1="-129.97708114469197" y1="0" x2="129.97708114469197" y2="0" stroke="#8c684e" stroke-width="10" stroke-linecap="round"/><line x1="-123.97708114469197" y1="-2" x2="124.97708114469197" y2="-2" stroke="#b7906b" stroke-width="2" stroke-linecap="round"/><line x1="-41.59266596630143" y1="0" x2="-53.59266596630143" y2="-16" stroke="#8c684e" stroke-width="4.0" stroke-linecap="round"/></g><g transform="translate(320.0 193.0) rotate(0.0)"><line x1="-132.0" y1="0" x2="132.0" y2="0" stroke="#8c684e" stroke-width="10" stroke-linecap="round"/><line x1="-126.0" y1="-2" x2="127.0" y2="-2" stroke="#b7906b" stroke-width="2" stroke-linecap="round"/><line x1="-42.24" y1="0" x2="-54.24" y2="-16" stroke="#8c684e" stroke-width="4.0" stroke-linecap="round"/></g><g transform="translate(343.5 261.5) rotate(145.1840331960241)"><l