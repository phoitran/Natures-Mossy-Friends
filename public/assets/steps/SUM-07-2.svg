<svg xmlns="http://www.w3.org/2000/svg" width="960" height="630" viewBox="0 0 960 630" role="img" aria-labelledby="title desc"><title id="title">Rocky friends — step 2: Lay out a body and a head</title><desc id="desc">Put your largest flat stone down for the body and a smaller one beside it for the head. Turn the pieces to try different shapes. Keep both on the ground or tray, rather than balancing the head on top.</desc><defs>
