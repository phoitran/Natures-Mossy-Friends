<svg xmlns="http://www.w3.org/2000/svg" width="960" height="630" viewBox="0 0 960 630" role="img" aria-labelledby="title desc"><title id="title">Fall Mandalas — step 3: Make your first circle</title><desc id="desc">Arrange leaves around the centre, pointing inward or outward. Repeat a colour or alternate two shapes all the way around. Leave gaps if you like; the circle does not need to be perfect.</desc><defs>
