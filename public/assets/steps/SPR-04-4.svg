<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc"><title id="title">Leaf-rubbing discoveries: Rub and reveal</title><desc id="desc">Move the crayon back and forth across the hidden leaf with light pressure. Start at one edge and work across. Stop when the veins appear; pressing harder can hide the pattern.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#bd7254" stroke-width="2"/></marker></defs><rect width="640" height="420" rx="24" fill="#f8f6ee"/><rect x="170" y="100" width="300" height="215" rx="3" fill="#fffef7" stroke="#b8b4a4" stroke-width="3"/><g transform="translate(260 195) rotate(20)"><path d="M0 -55.0 C52.8 -27.5 44.0 35.2 0 55.0 C-44.0 35.2 -52.8 -27.5 0 -55.0 Z" fill="#d9a54b" stroke="#355344" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="0" y1="-39.6" x2="0" y2="66.0" stroke="#355344" stroke-width="2" stroke-linecap="round"/><line x1="0" y1="-22.0" x2="-20.9" y2="-38.5" stroke="#355344" stroke-width="1.5" stroke-linecap="round"/><line x1="0" y1="-22.0" x2="20.9" y2="-38.5" stroke="#355344" stroke-width="1.5" stroke-linecap="round"/><line x1="0" y1="0" x2="-20.9" y2="-16.5" stroke="#355344" stroke-width="1.5" stroke-linecap="round"/><line x1="0" y1="0" x2="20.9" y2="-16.5" stroke="#355344" stroke-width="1.5" stroke-linecap="round"/><line x1="0" y1="22.0" x2="-20.9" y2="5.5" stroke="#355344" stroke-width="1.5" stroke-linecap="round"/><line x1="0" y1="22.0" x2="20.9" y2="5.5" stroke="#355344" stroke-width="1.5" stroke-linecap="round"/></g><g transform="translate(384 138) rotate(-20)"><rect x="-50" y="-10" width="100" height="20" rx="4" fill="#d9a54b" stroke="#a77d38" stroke-width="3"/></g><path d="M385 179 L339 220" fill="none" stroke="#bd7254" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><text x="320" y="290" font-family="Arial,sans-serif" font-size="20" font-weight="500" text-anchor="middle" fill="#293e32">light pressure</text><text x="320" y="382" font-family="Arial,sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#293e32">Rub gently until the pattern appears</text></svg>