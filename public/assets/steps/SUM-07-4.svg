<svg xmlns="http://www.w3.org/2000/svg" width="960" height="630" viewBox="0 0 960 630" role="img" aria-labelledby="title desc"><title id="title">Rocky friends — step 4: Add a little personality</title><desc id="desc">Choose suitable stones for features or add crayon eyes to a stone you own. Lay short twigs flat for whiskers or antennae. Your creature can also have an imaginary face. Leave the pieces loose so you can change its expression or pose.</desc><defs>
