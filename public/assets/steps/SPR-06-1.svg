<svg xmlns="http://www.w3.org/2000/svg" width="960" height="630" viewBox="0 0 960 630" role="img" aria-labelledby="title desc"><title id="title">Meet the mud creatures — step 1: Gather a creature collection</title><desc id="desc">Set out your bowl and tray. With a grown-up, gather clean soil, smooth stones and a few blunt fallen twigs, leaves or approved flowers. Decide which pieces could become eyes, ears, hair or spines.</desc><defs>
