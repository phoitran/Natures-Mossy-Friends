7" y1="0" x2="129.97708114469197" y2="0" stroke="#8c684e" stroke-width="10" stroke-linecap="round"/><line x1="-123.97708114469197" y1="-2" x2="124.97708114469197" y2="-2" stroke="#b7906b" stroke-width="2" stroke-linecap="round"/><line x1="-41.59266596630143" y1="0" x2="-53.59266596630143" y2="-16" stroke="#8c684e" stroke-width="4.0" stroke-linecap="round"/></g><g transform="translate(282.5 217.5) rotate(-71.56505117707799)"><line x1="-128.5854122563142" y1="0" x2="128.5854122563142" y2="0" stroke="#8c684e" stroke-width="10" stroke-linecap="round"/><line x1="-122.58541225631421" y1="-2" x2="123.58541225631421" y2="-2" stroke="#b7906b" stroke-width="2" stroke-linecap="round"/><line x1="-41.14733192202055" y1="0" x2="-53.14733192202055" y2="-16" stroke="#8c684e" stroke-width="4.0" stroke-linecap="round"/></g><text x="320" y="382" font-family="Arial,sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#293e32">Overlap twig ends by about 2 cm</text></svg>