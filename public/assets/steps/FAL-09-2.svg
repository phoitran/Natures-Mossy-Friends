<svg xmlns="http://www.w3.org/2000/svg" width="960" height="630" viewBox="0 0 960 630" role="img" aria-labelledby="title desc"><title id="title">Meet your fall friends — step 2: Lay out the body and face</title><desc id="desc">Lay a short twig flat for the body. Add twig arms and legs around it. Place a paper circle or small leaf above the body for the face. Try a waving pose or a dancing pose before adding clothes.</desc><defs>
