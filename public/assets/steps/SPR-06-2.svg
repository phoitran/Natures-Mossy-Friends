<svg xmlns="http://www.w3.org/2000/svg" width="960" height="630" viewBox="0 0 960 630" role="img" aria-labelledby="title desc"><title id="title">Meet the mud creatures — step 2: Mix mud that holds its shape</title><desc id="desc">Spoon soil into the bowl. Add a little water and stir, then squeeze a small handful. It should hold a ball without dripping. Add more soil if it is runny. If sandy soil keeps crumbling, try clean clay-rich soil or make a flat creature.</desc><defs>
