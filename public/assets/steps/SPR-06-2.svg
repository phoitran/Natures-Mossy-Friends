dth="2" stroke-linecap="round" /><rect x="-19" y="68" width="66" height="29" rx="4" fill="#91a56c" stroke="#61483a" stroke-width="3" /></g><text x="745" y="463" font-family="Trebuchet MS, DejaVu Sans, Arial, sans-serif" text-anchor="middle" font-size="26" font-weight="600" fill="#3c5240">Holds a ball</text><text x="278" y="492" font-family="Trebuchet MS, DejaVu Sans, Arial, sans-serif" text-anchor="middle" font-size="26" font-weight="600" fill="#3c5240">A spoonful at a time</text><text x="480" y="588" font-family="Trebuchet MS, DejaVu Sans, Arial, sans-serif" text-anchor="middle" font-size="25" font-weight="700" fill="#3c5240">Too runny? Add soil. Crumbly? Make a flat creature.</text></svg>