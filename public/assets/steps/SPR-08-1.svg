<svg xmlns="http://www.w3.org/2000/svg" width="960" height="630" viewBox="0 0 960 630" role="img" aria-labelledby="title desc"><title id="title">Muddy Faces — step 1: Find a place for a face</title><desc id="desc">With a grown-up, choose an approved tree with rough, sturdy bark at a comfortable height, or a flat patch of ground. Leave living moss, lichens and roots alone. Set your decorations nearby and imagine the expression you want to make.</desc><defs>
