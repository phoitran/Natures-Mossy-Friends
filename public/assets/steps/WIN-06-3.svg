<svg xmlns="http://www.w3.org/2000/svg" width="960" height="630" viewBox="0 0 960 630" role="img" aria-labelledby="title desc"><title id="title">Make a little snow man — step 3: Add a smaller snowball</title><desc id="desc">Make a smaller ball for the head. Flatten the top of the base a little, set the head on it and gently press loose snow around the join. You can add a small middle ball first for a three-ball friend. Keep the whole stack low and steady.</desc><defs>
