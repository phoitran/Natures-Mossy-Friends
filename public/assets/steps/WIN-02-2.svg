<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc"><title id="title">A pocket-sized snow village: Pack the first mould</title><desc id="desc">Fill a cup with packable snow, pressing each small handful down with a mitten. Level the top. If the snow will not pack, use a flat relief picture instead.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#bd7254" stroke-width="2"/></marker></defs><rect width="640" height="420" rx="24" fill="#f8f6ee"/><path d="M45 303 Q135 288 220 306 Q350 288 450 304 Q530 294 595 304" fill="none" stroke="#a4bbc4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><polygon points="240,130 400,130 377,292 263,292" fill="#dcecf1" stroke="#8ca9b3" stroke-width="3" stroke-linejoin="round"/><ellipse cx="320" cy="130" rx="80" ry="22" fill="#fffefa" stroke="#8ca9b3" stroke-width="3"/><circle cx="320" cy="112" r="50" fill="#f8fcfd" stroke="#9fbac4" stroke-width="3"/><path d="M287.5 121.0 Q300.0 144.5 327.5 146.0" fill="none" stroke="#d7e6eb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M320 60 L320 91" fill="none" stroke="#bd7254" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><text x="486" y="212" font-family="Arial,sans-serif" font-size="20" font-weight="500" text-anchor="middle" fill="#293e32">pack in layers</text><text x="320" y="382" font-family="Arial,sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#293e32">Use clean, packable snow</text></svg>