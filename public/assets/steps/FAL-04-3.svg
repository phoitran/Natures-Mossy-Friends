<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc"><title id="title">An autumn leaf garland: Clip the first leaf</title><desc id="desc">Fold a leaf stem over the string. Slide a large paper clip over the folded stem so it holds both stem and string together. If the stem snaps, clip the broad leaf base instead.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#bd7254" stroke-width="2"/></marker></defs><rect width="640" height="420" rx="24" fill="#f8f6ee"/><line x1="150" y1="150" x2="490" y2="150" stroke="#9b835d" stroke-width="5" stroke-linecap="round"/><g transform="translate(320 240) rotate(0)"><path d="M0 -65.0 C62.4 -32.5 52.0 41.6 0 65.0 C-52.0 41.6 -62.4 -32.5 0 -65.0 Z" fill="#d9a54b" stroke="#355344" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="0" y1="-46.8" x2="0" y2="78.0" stroke="#355344" stroke-width="2" stroke-linecap="round"/><line x1="0" y1="-26.0" x2="-24.7" y2="-45.5" stroke="#355344" stroke-width="1.5" stroke-linecap="round"/><line x1="0" y1="-26.0" x2="24.7" y2="-45.5" stroke="#355344" stroke-width="1.5" stroke-linecap="round"/><line x1="0" y1="0" x2="-24.7" y2="-19.5" stroke="#355344" stroke-width="1.5" stroke-linecap="round"/><line x1="0" y1="0" x2="24.7" y2="-19.5" stroke="#355344" stroke-width="1.5" stroke-linecap="round"/><line x1="0" y1="26.0" x2="-24.7" y2="6.5" stroke="#355344" stroke-width="1.5" stroke-linecap="round"/><line x1="0" y1="26.0" x2="24.7" y2="6.5" stroke="#355344" stroke-width="1.5" stroke-linecap="round"/></g><path d="M320 175 Q303 132 321 131 Q339 134 327 154" fill="none" stroke="#729769" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="307" y="143" width="28" height="65" rx="12" fill="none" stroke="#87948b" stroke-width="4"/><path d="M451 215 L345 180" fill="none" stroke="#bd7254" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><text x="458" y="185" font-family="Arial,sans-serif" font-size="20" font-weight="500" text-anchor="middle" fill="#293e32">large clip</text><text x="320" y="382" font-family="Arial,sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#293e32">Fold the stem over the string and clip</text></svg>