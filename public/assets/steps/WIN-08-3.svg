<svg xmlns="http://www.w3.org/2000/svg" width="960" height="630" viewBox="0 0 960 630" role="img" aria-labelledby="title desc"><title id="title">Snowy Friends — step 3: Shape and join the small parts</title><desc id="desc">Pinch a mouse snout from the front, or join a head and paws to a seated animal. Give a turtle a head and four flat flippers. A cat can have a curved tail supported along its body. Press extra snow around each join and blend it in; shorten parts that keep falling off.</desc><defs>
