<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc"><title id="title">Make a little snowman: Test a handful of snow</title><desc id="desc">With mittens on, squeeze a small handful. If it holds together, use that snow. If it remains powdery, switch to a flat snow picture rather than adding hot water or salt.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#bd7254" stroke-width="2"/></marker></defs><rect width="640" height="420" rx="24" fill="#f8f6ee"/><path d="M45 303 Q135 288 220 306 Q350 288 450 304 Q530 294 595 304" fill="none" stroke="#a4bbc4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="320" cy="215" r="67" fill="#f8fcfd" stroke="#9fbac4" stroke-width="3"/><path d="M276.45 227.06 Q293.2 258.55 330.05 260.56" fill="none" stroke="#d7e6eb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M185 212 L236 212" fill="none" stroke="#bd7254" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M455 212 L405 212" fill="none" stroke="#bd7254" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><text x="320" y="110" font-family="Arial,sans-serif" font-size="20" font-weight="500" text-anchor="middle" fill="#293e32">does a small handful hold?</text><text x="320" y="382" font-family="Arial,sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#293e32">Packable snow holds a gentle squeeze</text></svg>