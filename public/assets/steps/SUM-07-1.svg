<svg xmlns="http://www.w3.org/2000/svg" width="960" height="630" viewBox="0 0 960 630" role="img" aria-labelledby="title desc"><title id="title">Rocky friends — step 1: Find interesting stone shapes</title><desc id="desc">Set out smooth stones checked by a grown-up. Look for broad, narrow, round and oval shapes. Arrange them on a flat tray or clear ground and imagine what each one could become. You can use just a few pieces.</desc><defs>
