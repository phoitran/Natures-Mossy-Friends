<svg xmlns="http://www.w3.org/2000/svg" width="960" height="630" viewBox="0 0 960 630" role="img" aria-labelledby="title desc"><title id="title">Muddy Faces — step 3: Press a flat face shape</title><desc id="desc">Gently press a small, thick oval of mud onto the approved bark, or flatten it on the ground. Smooth the edges with your fingers. Keep it low and fairly flat so it stays in place. If it slips, move your face to the ground instead of forcing it onto the tree.</desc><defs>
