<svg xmlns="http://www.w3.org/2000/svg" width="960" height="630" viewBox="0 0 960 630" role="img" aria-labelledby="title desc"><title id="title">Meet the mud creatures — step 3: Shape a body and a head</title><desc id="desc">Press a mud ball onto the tray so it has a wide, steady base. Keep it as one round creature, or add a smaller head. Press joined pieces firmly together and smooth the seam with a damp finger. A low oval makes a good hedgehog.</desc><defs>
