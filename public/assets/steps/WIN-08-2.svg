<svg xmlns="http://www.w3.org/2000/svg" width="960" height="630" viewBox="0 0 960 630" role="img" aria-labelledby="title desc"><title id="title">Snowy Friends — step 2: Build one low body</title><desc id="desc">Press snow into a mound with a broad base. Smooth an oval mouse, a seated rabbit, cat or bear, or a wide dome for a turtle. Begin with a small body. A grown-up can help you build up a larger seated shape without lifting heavy snow.</desc><defs>
