<svg xmlns="http://www.w3.org/2000/svg" width="960" height="630" viewBox="0 0 960 630" role="img" aria-labelledby="title desc"><title id="title">Make a little snow man — step 2: Pat a sturdy little base</title><desc id="desc">Press several handfuls into one round snowball. Set it on the ground and flatten the bottom so it sits steadily. Keep it small enough to shape with your hands; this friend does not need giant rolled snowballs.</desc><defs>
