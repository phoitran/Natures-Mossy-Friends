<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc"><title id="title">Pictures in the snow: Smooth a snow canvas</title><desc id="desc">Choose a flat patch about 40 cm wide. Pat the surface with mittened hands until it is gently even. Leave the snow on the ground rather than digging a hole.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#bd7254" stroke-width="2"/></marker></defs><rect width="640" height="420" rx="24" fill="#f8f6ee"/><ellipse cx="320" cy="220" rx="235" ry="105" fill="#edf5f7" stroke="#b8cbd1" stroke-width="3"/><path d="M180 220 Q320 180 465 220 M180 242 Q320 200 465 242" fill="none" stroke="#b8cbd1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M320 80 L320 130" fill="none" stroke="#bd7254" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><text x="320" y="65" font-family="Arial,sans-serif" font-size="20" font-weight="500" text-anchor="middle" fill="#293e32">pat smooth</text><text x="320" y="382" font-family="Arial,sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#293e32">Make a flat canvas; do not dig</text></svg>