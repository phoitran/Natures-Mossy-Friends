<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc"><title id="title">Make a little snowman: Add two smaller balls</title><desc id="desc">Make a middle ball about 10 cm wide and a head about 7 cm wide. An adult helps set them on the base. Press a little snow into the joins so the stack stays still.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#bd7254" stroke-width="2"/></marker></defs><rect width="640" height="420" rx="24" fill="#f8f6ee"/><path d="M45 303 Q135 288 220 306 Q350 288 450 304 Q530 294 595 304" fill="none" stroke="#a4bbc4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="320" cy="260" r="65" fill="#f8fcfd" stroke="#9fbac4" stroke-width="3"/><path d="M277.75 271.7 Q294.0 302.25 329.75 304.2" fill="none" stroke="#d7e6eb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="320" cy="171" r="46" fill="#f8fcfd" stroke="#9fbac4" stroke-width="3"/><path d="M290.1 179.28 Q301.6 200.9 326.9 202.28" fill="none" stroke="#d7e6eb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="320" cy="106" r="32" fill="#f8fcfd" stroke="#9fbac4" stroke-width="3"/><path d="M299.2 111.76 Q307.2 126.8 324.8 127.76" fill="none" stroke="#d7e6eb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M455 110 L371 165" fill="none" stroke="#bd7254" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><text x="470" y="85" font-family="Arial,sans-serif" font-size="20" font-weight="500" text-anchor="middle" fill="#293e32">adult helps stack</text><text x="320" y="382" font-family="Arial,sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#293e32">Use 10 cm and 7 cm upper sections</text></svg>