name: Validate source
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_CF_FETCH_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked JavaScript dependencies
        run: npm run install:ci
      - name: Install media validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r requirements-dev.txt
      - name: Validate content and server logic
        run: npm test
      - name: Type check
        run: npm run typecheck
      - name: Validate shipped media
        run: npm run test:media
      - name: Build Sites mode
        run: npm run build
      - name: Build independent mode without deploying
        run: npm run build:standalone
